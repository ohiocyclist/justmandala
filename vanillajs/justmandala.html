<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.4" />
    <script src="symmetry.js" defer></script>
    <style>
      .colorbutton { color: white; border: none; padding: 15px 32px; cursor: pointer; border-radius: 5px; } 
      .pop-out {transform: scale(1.15);box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.3);}
    </style>    
    <title>JustMandala - Let's Chill Out!</title>
  </head>
  <body class="box-border w-screen h-screen">
    <div>
      <canvas
        id="drawCanvas"
        width="1000"
        height="1000"
      ></canvas>
    </div>
    <h3>Brush Color:</h3>
    <div id='colorbuttons'></div>
    <h3>Brush Size: <span id="sliderValue"></span></h3>    
    <input type="range" id="mySlider" min="2" max="24" value="4" style="width: 300px">
    <h3>Mirror Factor: <span id="sliderValue2"></span></h3>
    <input type="range" id="mySlider2" min="2" max="50" value="16" style="width: 450px">
    <div>
    <button id="loadButton">Clear Canvas</button>
    <button id="randButton">Random Draw</button>
    <button id="drawFillSwap">Toggle Draw/Fill</button> currently set to: <span id="drawOrFill"></span>
    <button id="drawFillOther">Toggle Fill as Every/Every Other/Only One</button> currently set to: <span id="fillOrOther"></span>
    </div>
  </body>
</html>
