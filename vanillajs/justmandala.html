<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.4" />
    <script src="symmetry.js" defer></script>
    <style>
      .colorbutton { color: white; border: none; padding: 15px 32px; cursor: pointer; border-radius: 5px; } 
      .pop-out {transform: scale(1.15);box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.3);}
    </style>    
    <title>JustMandala - Let's Chill Out!</title>
  </head>
  <body class="box-border w-screen h-screen">
    <div>
      <canvas
        id="drawCanvas"
        width="1000"
        height="1000"
      ></canvas>
    </div>
    <h3>Brush Color:</h3>
    <div id='colorbuttons'></div>
    <h3>Brush Size: <span id="sliderValue"></span></h3>    
    <input type="range" id="mySlider" min="2" max="24" value="4" style="width: 300px">
    <h3>Mirror Factor: <span id="sliderValue2"></span></h3>
    <input type="range" id="mySlider2" min="2" max="50" value="16" style="width: 450px">
    <div>
    <button id="loadButton">Clear Canvas</button>
    <button id="randButton">Random Draw</button>
    Toggle Pointer Type: 
    <input type="radio" name="pointer" value="draw" id="draw"><label for="draw">Draw</label>
    <input type="radio" name="pointer" value="fill" id="fill"><label for="fill">Fill</label>
    <input type="radio" name="pointer" value="drop" id="drop"><label for="drop">Color Dropper</label>
    &nbsp;Toggle Fill Type:
    <input type="radio" name="fillstyle" value="every" id="every"><label for="every">Every Symmetric</label>
    <input type="radio" name="fillstyle" value="other" id="other"><label for="other">Every Other Symmetric</label>
    <input type="radio" name="fillstyle" value="one" id="one"><label for="one">Just the clicked area</label>
    </div>
    <div>
    <h4>
    Flexible Color:
    </h4>
    </div>
    <div>
    Red: <span id="rsliderValue"></span>
    <input type="range" id="redSlider" min="0" max="255" value="127" style="width: 150px">
    Green: <span id="gsliderValue"></span>
    <input type="range" id="greenSlider" min="0" max="255" value="127" style="width: 150px">
    Blue: <span id="bsliderValue"></span>
    <input type="range" id="blueSlider" min="0" max="255" value="127" style="width: 150px">
  </body>
</html>
