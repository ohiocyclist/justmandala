<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.4" />
    <script src="symmetry.js" defer></script>
    <script src="randomdraw.js" defer></script>
    <style>
      .colorbutton { color: white; border: none; padding: 15px 32px; cursor: pointer; border-radius: 5px; } 
      .pop-out {transform: scale(1.2);box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.3);}
      :root {
        --bg: #242424;
        --panel: #1e1e1e;
        --panel2: #2b2b2b;
        --text: #e5e7eb;
        --accent: #4f46e5;
        --border: #3a3a3a;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 20px;
      }

      canvas {
        background: white;
      }

      .acan {
        margin-left: 5px;
        border: 3px solid transparent;
      }

      .selected-canvas {
        outline: 3px solid red;
      }

      .control-panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-top: 12px;
      }      
      .btn {
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: .2s;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-primary {
        background: #0d6efd;
        color: white;
      }

      .btn-success {
        background: #198754;
        color: white;
      }

      .btn-warning {
        background: #ffc107;
        color: black;
      }

      .btn-danger {
        background: #dc3545;
        color: white;
      }      

      .drawer {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        margin: 12px 0;
        padding: 12px;
      }

      .drawer summary {
        cursor: pointer;
        font-size: 1.1rem;
        font-weight: 700;
      }

      .drawer[open] summary {
        margin-bottom: 12px;
      }      

      input[type="radio"] {
        display: none;
      }

      .radio-btn {
        display: inline-block;
        padding: 8px 14px;
        margin: 4px;
        border: 1px solid #495057;
        border-radius: 8px;
        background: #343a40;
        color: white;
        cursor: pointer;
        transition: .2s;
      }

      .radio-btn:hover {
        background: #495057;
      }

      input[type="radio"]:checked + .radio-btn {
        background: #0d6efd;
        border-color: #0d6efd;
        color: white;
      }      

      input[type="file"]::file-selector-button {
          background: #0d63fd;
          color: white;
          border: none;
          padding: 10px 18px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: 600;
      }

      input[type="file"]::file-selector-button:hover {
          background: #0432A0;
      }      
    </style>    
    <title>Evolutionary Mandala -- Choose Your Way to Success!</title>
  </head>

    <div style="display: flex">

</html>
